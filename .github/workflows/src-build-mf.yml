name: Source Build MF
# run-name 的表达式没有截取子串的函数, 所以短 hash 由触发方传 (short)
run-name: MF ${{ inputs.short }} ${{ inputs.images }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: source commit
        required: true
      base:
        description: commit to compare against (optional)
        required: false
        default: ""
      short:
        description: short commit id shown in the run title
        required: true
      images:
        description: which images to build (short codes, also shown in the run title)
        required: false
        default: ""

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/src-build.yml
    with:
      source: MF
      ref: ${{ inputs.ref }}
      base: ${{ inputs.base }}
      images: ${{ inputs.images }}
    secrets: inherit
