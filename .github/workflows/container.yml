name: Run in Container
on:
  workflow_dispatch:

jobs:
  run-in-container:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goodow/k3s
      credentials:
        username: USERNAME
        password: ${{ secrets.GHCR_TOKEN_FOR_TIANXA }}
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      options: >-
        --privileged
      volumes:
        # cgroups（跑 containerd/kubelet 往往需要）
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        # 内核模块（iptables/nf_conntrack 等场景可能用得上）
        - /lib/modules:/lib/modules:ro
        - /var/lib/rancher/k3s:/var/lib/rancher/k3s

    steps:
      - name: Check Public IP
        run: |
          echo "Public IP:"
          curl -s ifconfig.me
          echo ""

      - name: Start k3s agent (background)
        shell: bash
        env:
          K3S_URL: ${{ secrets.K3S_URL }}
          K3S_TOKEN: ${{ secrets.K3S_TOKEN }}
          K3S_NODE_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          echo "Starting k3s agent, node=${K3S_NODE_NAME}"
          nohup /bin/k3s agent \
            --node-name "${K3S_NODE_NAME}" --node-taint "no-external-ip=true:NoExecute" \
            > /var/log/k3s-agent.log 2>&1 &

      - run: cloudflared tunnel --no-autoupdate run --token ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }} &
      - run: /usr/sbin/sshd -p 31220 && sleep infinity

defaults:
  run:
    shell: bash