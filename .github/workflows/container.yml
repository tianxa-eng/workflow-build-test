# 手写对照版 —— 用来调试, 不参与生产扩缩容。
#
# ══════════════════════════════════════════════════════════════════════════════
# 与生产版的关系
# ══════════════════════════════════════════════════════════════════════════════
# 生产的节点仓 workflow 由 gdq.capacity.gha.provision.k8s_node 从 container.yml.tmpl
# 渲染并推送, 那份是**机器生成、公开可读**的, 所以零注释、单个不透明 secret、
# 每仓不同形(防泄漏纪律见 quant/k8s-manifests/k8s/gha/README.sh)。
# 本文件相反: 目标是**看得懂、能分步排查** —— 具名 secret、带注释、四个具名 step。
#
# ★★★ 前提更正 (2026-09-01): 从前这里写着"它跑在本仓(自己人可读)"。**那是错的。**
#   tianxa-eng/workflow-build-test 是 **public** 仓 (GitHub API: "private": false),
#   于是它的 Actions run 日志任何人不登录都能看, 已有 295 次 run 可被匿名枚举。
#   本文件的可读性设计(具名 secret / 注释 / 分步)全部建立在"自己人可读"之上, 前提没了,
#   剩下的就只有防泄漏这一件事。所以下面按"日志是公开的"重写了三处:
#     a) B/D 两个 base64 blob 进 $GITHUB_ENV 之前先 ::add-mask::
#        —— GitHub 只遮 secret 的**原样字符串**, base64 之后一个字都不遮, 而 B 恰恰
#           是把全部凭据打成一个 base64 串
#     b) permissions: {} —— GITHUB_TOKEN 也是"能从 run 里拿到的凭据"之一
#     c) 失败转储改调 `node-entrypoint diag`, 由镜像做遮蔽; 原来的 `wg show` 会把
#        集群每个常驻节点的公网 IP:51820 与 peer 公钥原样打进公开日志
#   ★ 这三条只堵"从日志读出来"。真正的收口是**把本仓改成 private**
#     (gh repo edit tianxa-eng/workflow-build-test --visibility private),
#     那之后连注释与 secret 名字的架构泄漏一并解决 —— 见 README 第 5 节。
#
# 行为一致靠的是"两边都只调镜像里的同一份 node-entrypoint", 而不是靠两份 yaml 互相对齐:
#     生产版:  docker run --rm ... $IMG   -> CMD = node-entrypoint (= pre && debug && up && hold)
#     本文件:  四个 step 分别跑 node-entrypoint pre / debug / up / hold
# 四个相位合起来与全流程逐字等价。所以本文件里**没有任何业务逻辑**, 改行为请改镜像。
#
# ── 为什么保留 GHA 原生 container: 而不是照抄生产版的 docker run ──────────────
# 从前这里写着"两者收尾预算相同, 都是约 10 秒"。**那个结论已经不成立**, 因为两边
# 现在都补了收尾 step:
#   本文件    最后一个 `if: always()` step 调 node-entrypoint cleanup (D 里 CLEANUP=step)
#   生产版    docker run -d + `if: always()` 的 docker stop -t N   (D 里 CLEANUP=trap)
# 两条路径都落在"收尾 step"上, GitHub 给整整 5 分钟(正在跑的 step 只有约 10 秒)。
# 预算既然相同, 就选可读性更好的那个:
#   - 每个 step 一个名字, 红在哪一相位一目了然
#   - 后面可以随手加临时排查 step, 它们和 agent 在同一个容器里
#   - 不必在 yaml 里手搓 docker login/pull
#
# ── 输入 ──────────────────────────────────────────────────────────────────────
# 本仓用具名 secret(可读性优先), 生产版用单个 base64 的 CFG(防泄漏优先)。
# 两者最终都拼成同样的 B/D 两个 blob 交给镜像, 所以镜像那边不需要分支。
name: Run in Container

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '节点保持在线的分钟数 (GitHub 单 job 上限 360)'
        required: false
        default: '345'
      lead:
        description: '到期前多少分钟开始主动排空 (给快照边车留出时间)'
        required: false
        default: '15'

jobs:
  run-in-container:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # 本 job 一次 GitHub API 都不调(连 checkout 都没有), 所以 GITHUB_TOKEN 一个权限都不需要。
    # 不写这一行时它拿的是仓库默认权限 —— 而"能从一次 run 里拿到的凭据"这份清单上,
    # 它和下面那几个 secret 是同一类东西。
    permissions: {}

    container:
      image: ghcr.io/goodow/k3s
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN_FOR_TIANXA }}
      options: >-
        --privileged
        --cgroupns=host
      # --cgroupns=host 是必需的, 不是优化项:
      # runner 宿主机是 cgroup v2。docker 在 cgroup v2 下默认 cgroupns=private, 容器自己的
      # scope 就是它的 cgroup 命名空间根; 而下面又把宿主机的 /sys/fs/cgroup 整棵树挂了进来。
      # 两者不一致时 runc 无法把 PID 写进 cgroup, 症状是 Pod 永远 ContainerCreating, 报
      # cgroup.procs: no such file or directory。gha-assert pre 会直接检出这一项。
      volumes:
        # cgroups (跑 containerd/kubelet 需要)
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        # 内核模块 (wireguard-native 后端必需, modprobe wireguard 要读这里)
        - /lib/modules:/lib/modules:ro
        # ★ 数据目录必须是宿主机 bind mount。容器名 /mnt/w 是镜像的 DATA_DIR 契约
        # (Dockerfile 的 ENV, gha-assert / node-entrypoint / k3s agent --data-dir 全部按它)。
        # ★ 理由**不是"/ 盘小"** —— 那是一处长期误记。实测 runner 上:
        #     overlay    145G  已用 60G  /
        #     /dev/root  145G  已用 60G  /mnt/w      <- 同一块盘, 换目录一个字节也多不出来
        # 真正的理由是 **overlay 不能套 overlay**: / 本身就是 docker 的 overlay 上层, 而
        # containerd 的 root 要落在这里且 snapshotter=overlayfs。实测 mount -t overlay:
        #     在 /      -> wrong fs type, bad option, bad superblock   (失败)
        #     在 /mnt/w -> OK                                          (ext4)
        # 落在 / 上时 overlayfs snapshotter 建不起来, containerd 只剩 native / fuse-overlayfs
        # 可退, 而 native 是逐层整份复制镜像。(退到哪一个没实测, 实测的是上面那条 mount 失败)
        # gha-assert pre 第 2 条断言的就是这一点。
        - /mnt/w:/mnt/w

    env:
      # ── B: 不可约 bootstrap (生产版是仓库 secret CFG 的原样透传) ──────────
      # 这里用 python 拼 JSON 而不是手写字符串: token 里出现引号/反斜杠时手写会静默拼坏。
      B_SERVER_URL: ${{ secrets.K3S_URL }}
      B_JOIN_TOKEN: ${{ secrets.K3S_TOKEN }}
      B_DRAIN_TOKEN: ${{ secrets.K3S_DRAIN_TOKEN }}
      B_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      B_SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
      MINUTES: ${{ inputs.minutes }}
      LEAD: ${{ inputs.lead }}

    steps:
      # ── 0. 拼 B / D ────────────────────────────────────────────────────────
      # ★ NODE_NAME 的形状必须与生产版一致: "<repo-slug>-run-<run_id>-<attempt>"。
      #   autoscaler 靠它把 Node 反解回 GHA run 才能 cancel(node_policy.parse_node);
      #   名字对不上不会报任何错, 只是"缩容时 cancel 不掉, 白烧额度到 6h"。
      #   集群里现存的 gha-33178131066-1 就是老版本用 gha-<run_id>-<attempt> 留下的,
      #   autoscaler 认不出它。
      #
      # ★ 遮蔽纪律 (run 日志是公开的):
      #   GitHub 只遮 secret 的**原样字符串**。B 是把 SERVER_URL/JOIN_TOKEN/DRAIN_TOKEN/
      #   TUNNEL_TOKEN 打成一个 JSON 再 base64 —— 那个串与任何一个 secret 都不逐字相同,
      #   所以**默认不被遮**。它随后进了 $GITHUB_ENV, 也就是后面每个 step 都看得见的环境变量:
      #   任何一处 `env` / `set -x` / 崩溃时的环境转储, 都会把全部凭据以可 base64 -d 的形式
      #   写进一份公开日志。
      #   所以先算出来 -> 立刻 ::add-mask:: -> 再写 $GITHUB_ENV。顺序不能反,
      #   add-mask 只对**其后**产生的输出生效。
      #   (python 因此改成写文件而不是直接 >> $GITHUB_ENV —— 要先经手一道才能遮。)
      - name: Build input blobs
        shell: bash
        run: |
          set -euo pipefail
          BLOBS=$(mktemp); trap 'rm -f "$BLOBS"' EXIT
          python3 - "$BLOBS" <<'PY'
          import base64, json, os, sys
          e = os.environ
          b = {k[2:]: e[k] for k in e if k.startswith("B_") and e[k]}
          slug = e["GITHUB_REPOSITORY"].replace("/", "-").replace("_", "-").lower()
          d = {
              "NODE_NAME": f'{slug}-run-{e["GITHUB_RUN_ID"]}-{e["GITHUB_RUN_ATTEMPT"]}',
              "HOLD_MINUTES": e["MINUTES"],
              "LEAD_MINUTES": e["LEAD"],
              # 收尾在下面那个 if: always() 的 step 里做, 所以 hold 的 trap 要让开 ——
              # 它只有约 10 秒, 抢先删掉 Node 会让有 5 分钟预算的收尾 step 无从排空。
              "CLEANUP": "step",
              # 收尾 step 的预算。GitHub 给 5 分钟(300s), 这里留 100s 余量:
              # cordon 10 + drain (240-30) + delete 20 都在 240 秒内。
              "STOP_TIMEOUT": "240",
              # ★ 本仓是**调试仓**, 它起的节点不该被 autoscaler 当成生产供给。
              # entrypoint 见到它就给节点多打一个 agent-node/debug=true,
              # autoscaler 的 list_ephemeral_nodes 用 `!agent-node/debug` 排除。
              #
              # 不排除的话有两个后果, 第二个更贵:
              #   a) 手工起一台调试节点, autoscaler 就少起一台生产节点 —— 生产容量凭空少 1;
              #   b) 更糟: 它会被当成缩容对象。缩容会 cancel 掉对应的 GHA run ——
              #      也就是**把你正在调试的那个 run 掐掉**, 而且看起来像"莫名其妙断了"。
              # 仍然带着 ephemeral-node=gha 这个 label, 所以业务负载照常能调度上来 ——
              # 调试的全部意义就在于此。
              "DEBUG": "1",
          }
          enc = lambda o: base64.b64encode(json.dumps(o).encode()).decode()
          with open(sys.argv[1], "w") as f:
              f.write(f'B={enc(b)}\nD={enc(d)}\nNODE_NAME={d["NODE_NAME"]}\n')
          PY

          # 只遮 B/D。NODE_NAME 不遮 —— 它由公开的 run_id 派生, 而排查时第一件要看的就是它,
          # 遮掉等于把日志变成一串 ***。
          while IFS= read -r line; do
            echo "::add-mask::${line#*=}"
          done < <(grep -E '^(B|D)=' "$BLOBS")
          # 兜一道: 万一镜像里哪天单独 base64 了某一个字段, 那个变形也已经在遮蔽表里。
          for v in "${B_SERVER_URL:-}" "${B_JOIN_TOKEN:-}" "${B_DRAIN_TOKEN:-}" "${B_TUNNEL_TOKEN:-}"; do
            [ -n "$v" ] && echo "::add-mask::$(printf %s "$v" | base64 | tr -d '\n')"
          done
          cat "$BLOBS" >> "$GITHUB_ENV"
          echo "节点名 = $(sed -n 's/^NODE_NAME=//p' "$BLOBS")"

      # ── 1. 静态前提 ────────────────────────────────────────────────────────
      # wireguard 模块 / 数据目录不在 overlayfs 上 / CNI 插件齐全 / cgroup 命名空间。
      # 这四条每一条都会以「和运行环境毫无关系的错误」出现(缺 CNI 报的是 subnet.env
      # 找不到, cgroupns 不对报的是 runc 写 cgroup.procs 失败), 所以在这里硬失败。
      - name: Preflight
        shell: bash
        run: node-entrypoint pre

      # ── 2. 人工排查通道 (sshd 31220 + cloudflared tunnel) ─────────────────
      # 排在起 agent **之前**是刻意的: `node-entrypoint up` 里的 gha-assert post 检的是
      # flannel 就绪与 peer 握手, 那正是最需要人进去看的一类故障 —— 而它一失败 up 就
      # exit 1。通道埋在 up 里(以前就是)等于"最需要它的时候它一定不在"。
      # CFG 里没给 TUNNEL_TOKEN / SSH_PUBKEY 时这一步是干净的空转, 不会失败。
      # 整套不需要人工进 runner 的话, 删掉本 step 即可(镜像里 cloudflared 约 35MB,
      # 是最大的可裁项), 生产版对应删 CFG 里那两个字段。
      - name: Start debug channel
        shell: bash
        run: node-entrypoint debug

      # ── 3. 起 agent + 网络前提 + kubeconfig + 到期注解 ─────────────────────
      - name: Start agent
        shell: bash
        run: node-entrypoint up

      # ── 4. 看门狗 + 到期前主动排空 ────────────────────────────────────────
      # 不是 sleep: agent 崩了要立刻让 job 变红(否则节点静默 NotReady 而 job 一路绿到底),
      # 到期前 LEAD 分钟要主动 cordon + drain 把硬杀变成 eviction(快照边车才收得到 SIGTERM)。
      - name: Hold
        shell: bash
        run: node-entrypoint hold

      # ── 5. 收尾: 主动排空 + 注销 (**手动 cancel 走的就是这一步**) ─────────
      # 为什么必须是一个独立的 `if: always()` step, 而不是靠 Hold 里的 trap:
      #   正在跑的 step 被 cancel 时只有约 10 秒 —— 不够走完一次 eviction, 快照边车
      #   收不到 SIGTERM, 最后一次快照就丢了; 而 `if: always()` 的 step 有整整 5 分钟。
      # 幂等: 正常到期时 Hold 已经排空过, 这一步只会看到"Node 已不存在"然后返回。
      # 它也**不会**因为前面红了而被跳过 —— 那正是最需要它的时候。
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          # 旧镜像没有 cleanup 这个相位 —— 它会打出用法然后 exit 2, 把一次**正常**的
          # 收尾变成一个红叉 (实测: "用法: node-entrypoint [all|pre|debug|up|hold]"
          # + "Process completed with exit code 2")。
          # 判据直接看脚本里有没有这个分支, 而不是去执行它: 不带参数跑 node-entrypoint
          # 等于 `all`, 会把整个流程重跑一遍。
          if grep -q '^  cleanup)' "$(command -v node-entrypoint)"; then
            node-entrypoint cleanup
          else
            echo "::warning::镜像里没有 cleanup 相位(旧镜像) —— 跳过, 节点交给 reaper CronJob 收尸"
          fi

      # ── 6. 失败时把现场打出来 (经遮蔽) ────────────────────────────────────
      # 镜像里没装排查工具(定位靠 gha-assert 的硬断言), 所以失败时至少把日志留下。
      #
      # ★ 这里从前是直接 `tail` 三份日志 + `wg show flannel-wg`。在 public 仓上那是一个
      #   实打实的泄漏口, 而且**它已经触发过**(本仓有一次 failure 的 Run in Container):
      #     wg show   逐 peer 列出 endpoint = 集群每个常驻节点的**公网 IP:51820**, 外加
      #               peer 公钥。这些值不是 secret, 所以 GitHub 一个字都不会遮 ——
      #               README 第 5 节要防的"定位 + 关联", 就是这一行送出去的。
      #     tunnel.log / agent.log
      #               原文里有 tunnel 身份、控制面 URL、以及各种**变了形**的凭据片段;
      #               secret 遮蔽只认逐字相同, 变形一律漏。
      #
      # 现在改成调镜像里的 diag 相位: 转储什么、遮什么由私有镜像决定, 公开 yaml 只留一个动词。
      # 这也符合本文件的总纲 —— 这里不放业务逻辑。
      # 未遮蔽的原文要看就走 step 2 起的 sshd 通道进节点看, 那条路不经过公开日志。
      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: |
          # 与 Cleanup 同样的旧镜像判据: 直接执行会把整个流程重跑一遍, 所以看脚本里有没有这一支。
          if grep -q '^  diag)' "$(command -v node-entrypoint)"; then
            node-entrypoint diag
          else
            echo "::warning::镜像里没有 diag 相位(旧镜像) —— 跳过转储。"
            echo "::warning::不回退到直接 tail/wg show: 那会把集群 endpoint 与 peer 公钥打进公开日志。"
          fi
