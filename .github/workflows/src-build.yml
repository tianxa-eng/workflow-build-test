# 通用构建, 只被 src-build-<source>.yml 调用 (每个源仓库一个入口, Actions 页面按 workflow 过滤, run 标题带短 hash)。
# 加一个源仓库: 复制一份入口文件, 改 name / run-name / source, 再加 secret SRC_REPO_<SOURCE>。
name: Source Build (reusable)

on:
  workflow_call:
    inputs:
      source:
        description: source key (MN / MF)
        required: true
        type: string
      ref:
        description: source commit
        required: true
        type: string
      base:
        description: commit to compare against (optional)
        required: false
        type: string
        default: ""
      images:
        description: which images to build (short codes the source maps to its own names; empty = the source decides)
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: src-build-${{ inputs.source }}-${{ inputs.ref }}-${{ inputs.images }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: -1002100967409
  SRC_REPO: ${{ secrets[format('SRC_REPO_{0}', inputs.source)] }}
  PAT_FOR_SRC_GD_DEV: ${{ secrets.PAT_FOR_SRC_GD_DEV }}
  REF: ${{ inputs.ref }}
  IMAGES: ${{ inputs.images }}
  # 一个提交分镜像建时各写各的状态
  STATUS_CONTEXT: public-build${{ inputs.images && format('/{0}', inputs.images) || '' }}
  BASE: ${{ inputs.base }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Fetch source
        run: |
          set -euo pipefail
          [ -n "$SRC_REPO" ] || { echo "::error::unknown source '${{ inputs.source }}'"; exit 1; }
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${PAT_FOR_SRC_GD_DEV}@github.com/${SRC_REPO}.git"
          git sparse-checkout set --no-cone /.github/public-build/
          git fetch -q --depth 1 --filter=blob:none origin "$REF" ${BASE:+"$BASE"}
          git checkout -q "$REF"
          while IFS= read -r w; do [ -z "$w" ] || echo "::add-mask::$w"; done < .github/public-build/mask
          git sparse-checkout set --no-cone --stdin < .github/public-build/sparse
          if [ -f .gitmodules ]; then
            git -c "url.https://x-access-token:${PAT_FOR_SRC_GD_DEV}@github.com/.insteadOf=git@github.com:" submodule update -q --init --depth 1
          fi
          git log -1 --format='%H %s'

      - name: Report pending
        run: |
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $PAT_FOR_SRC_GD_DEV" \
            "https://api.github.com/repos/$SRC_REPO/statuses/$REF" \
            -d "{\"state\":\"pending\",\"context\":\"$STATUS_CONTEXT\",\"description\":\"building\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Free Disk Space (Ubuntu)
        if: inputs.source == 'MN'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: USERNAME
          password: ${{ secrets.GHCR_TOKEN_MONO_FOR_TIANXA_GITHUB_ACTIONS }}

      - name: Build
        working-directory: src
        run: bash .github/public-build/run.sh

      - name: Report result
        if: always()
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $PAT_FOR_SRC_GD_DEV" \
            "https://api.github.com/repos/$SRC_REPO/statuses/$REF" \
            -d "{\"state\":\"$STATE\",\"context\":\"$STATUS_CONTEXT\",\"description\":\"$STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Send alert
        if: failure()
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="Source Build ${{ inputs.source }} failed: ${REF:0:12} $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # 串行的收尾 (同一个 source 一次一个): 源码里有 .github/public-build/after.sh 才跑, 例如把 :latest 移到最新的已建提交。
  # 排队中较早的那次被 concurrency 取消无妨, 收尾脚本按 registry 里已有的东西重算。
  # 只碰 ghcr、秒级结束; 慢的第二个 registry 同步在下面的 sync2, 不能放进这个串行组里挡住下一次 :latest 推进。
  after:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: src-after-${{ inputs.source }}
      cancel-in-progress: false
    steps:
      - name: Fetch source
        id: fetch
        run: |
          set -euo pipefail
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${PAT_FOR_SRC_GD_DEV}@github.com/${SRC_REPO}.git"
          git sparse-checkout set --no-cone /.github/public-build/
          git fetch -q --depth 1 --filter=blob:none origin "$REF"
          git checkout -q "$REF"
          while IFS= read -r w; do [ -z "$w" ] || echo "::add-mask::$w"; done < .github/public-build/mask
          [ -f .github/public-build/after.sh ] && echo "run=1" >> "$GITHUB_OUTPUT" || echo "nothing to do"

      - name: Login to registry
        if: steps.fetch.outputs.run == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: USERNAME
          password: ${{ secrets.GHCR_TOKEN_MONO_FOR_TIANXA_GITHUB_ACTIONS }}

      - name: After
        if: steps.fetch.outputs.run == '1'
        working-directory: src
        run: bash .github/public-build/after.sh

      - name: Send alert
        if: failure()
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="Source Build ${{ inputs.source }} after-step failed: ${REF:0:12} $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # 第二个 registry (境内, 链路慢, 一次可达数小时) 的同步: 源码里有 .github/public-build/sync2.sh 才跑。
  # 自己的串行组, 与 after 互不排队; 排队的只留最新一个 (连着合并多个提交时合并成只拷最新那个)。
  # 拷的是执行时 ghcr 的 :latest, 不是本次 run 的提交, 所以迟到、被替掉、重跑旧 run 都不会把第二个 registry 拉回旧提交。
  sync2:
    needs: after
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: src-sync2-${{ inputs.source }}
      cancel-in-progress: false
    env:
      REGISTRY2: ${{ secrets.TCR_REGISTRY }}
      REGISTRY2_OWNER: ${{ secrets.TCR_OWNER }}
    steps:
      - name: Fetch source
        id: fetch
        run: |
          set -euo pipefail
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${PAT_FOR_SRC_GD_DEV}@github.com/${SRC_REPO}.git"
          git sparse-checkout set --no-cone /.github/public-build/
          git fetch -q --depth 1 --filter=blob:none origin "$REF"
          git checkout -q "$REF"
          while IFS= read -r w; do [ -z "$w" ] || echo "::add-mask::$w"; done < .github/public-build/mask
          [ -f .github/public-build/sync2.sh ] && echo "run=1" >> "$GITHUB_OUTPUT" || echo "nothing to do"

      - name: Login to registry
        if: steps.fetch.outputs.run == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: USERNAME
          password: ${{ secrets.GHCR_TOKEN_MONO_FOR_TIANXA_GITHUB_ACTIONS }}

      # 第二个 registry 在境内, 从 GitHub 的 runner 登录偶尔超时 (docker 客户端 15 秒, "context deadline exceeded")。
      # 同一台 runner 上连试 5 次、3 分钟都不通 (run 40487243601), 换一台新 runner 几分钟后就通: 所以这里只重试一次就失败,
      # 由 src-build-retry.yml 在新 runner 上重跑这个任务 (按步骤名 "Login to second registry" 认, 改名要同步改那边)。
      - name: Login to second registry
        if: steps.fetch.outputs.run == '1' && env.REGISTRY2 != ''
        env:
          REGISTRY2_USERNAME: ${{ secrets.DOCKER_USERNAME_TCR }}
          REGISTRY2_PASSWORD: ${{ secrets.DOCKER_PASSWORD_TCR }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$REGISTRY2_PASSWORD" | docker login "$REGISTRY2" --username "$REGISTRY2_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::第二个 registry 登录失败 (第 $attempt/2 次)"
            [ "$attempt" = 2 ] || sleep 5
          done
          echo "::error::第二个 registry 在这台 runner 上连续登录失败; src-build-retry.yml 会换一台 runner 重跑一次"
          exit 1

      - name: Sync second registry
        if: steps.fetch.outputs.run == '1'
        working-directory: src
        run: bash .github/public-build/sync2.sh

      - name: Send alert
        if: failure()
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="Source Build ${{ inputs.source }} sync2-step failed: ${REF:0:12} $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
