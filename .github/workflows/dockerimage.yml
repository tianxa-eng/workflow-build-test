name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches:
      - mono

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: -1002100967409  # Alert channel ID

jobs:

  # ── 质量门禁: 验证不通过则阻止镜像构建 ────────────────────────────────────
  # 对应本地 find_and_verify.py <lib> 的 lib 级语义:
  # format/lint 检查包根; pyright 默认只检查生产文件; structural harness 按 lib 可选.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Extract Target Commit
        id: extract
        env:
          # 经环境变量而不是 ${{ }} 内插进脚本: 提交说明是外部输入, 内插会被当成 shell 执行
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TARGET_COMMIT=$(echo "$COMMIT_MSG" | grep -oE '@[0-9a-fA-F]+' | sed 's/@//')
          if [ -z "$TARGET_COMMIT" ]; then
            TARGET_COMMIT="main"
          fi
          echo "TARGET_COMMIT=$TARGET_COMMIT" >> $GITHUB_ENV

      - name: Init and update submodules
        env:
          PAT_FOR_GOODOW_MONO_SUBMODULES: ${{ secrets.PAT_FOR_GOODOW_MONO_SUBMODULES }}
          MONO_REPO: ${{ secrets.MONO_REPO }}
        run: |
          bash .github/scripts/overwrite.sh "${{ env.TARGET_COMMIT }}"
          git config --global url."https://x-access-token:${{ secrets.PAT_FOR_GOODOW_MONO_SUBMODULES }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # --check: 秒级验证 lockfile 与 pyproject.toml 一致, 不一致立即失败
      - name: Verify lockfile
        run: uv lock --check

      # lockfile 验证通过后安装 dev group (ruff, pyright, pytest)
      # --frozen: 跳过 re-resolve, 直接按已验证的 lockfile 安装
      - name: Install dependencies
        run: uv sync --frozen --group dev

#      - name: Verify libraries
#        run: uv run --no-sync python .github/scripts/verify_libraries.py gdq-rd gdq-sim gdq-etl

  # ── 镜像构建: 仅在验证通过后执行 ──────────────────────────────────────────
  # build (Free Disk / checkout / 拉镜像) 与 verify 并行启动以重叠 setup
  #
  # Build DAG (bake 自动并行):
  #   mono-base
  #     ├─ goodow-mono   (FROM mono-base, uv sync 全 workspace + dev)
  #     ├─ gdq-etl       (FROM mono-base, uv sync --package gdq-etl 子图; 与 goodow-mono 并行)
  #     └─ gdq-infra     (FROM mono-base, uv sync --package gdq-infra 子图; 同上)
  # 这里只推 sha-<完整 sha>; :latest 由下面的 promote-latest 移, 见那里
  build-and-push:
    runs-on: ubuntu-latest
    env:
      BAKE_TARGETS: mono-base,goodow-mono,gdq-etl,gdq-infra,gdq-rd,gdq-sim
      BAKE_SET: |
        *.context=.
        mono-base.context=.devcontainer/mono-base
        mono-base.cache-from=type=registry,ref=ghcr.io/goodow/mono-base:build-cache
        mono-base.cache-to=type=registry,ref=ghcr.io/goodow/mono-base:build-cache,mode=max
        goodow-mono.cache-from=type=registry,ref=ghcr.io/goodow/goodow-mono:build-cache
        goodow-mono.cache-to=type=registry,ref=ghcr.io/goodow/goodow-mono:build-cache,mode=max
        gdq-etl.cache-from=type=registry,ref=ghcr.io/goodow/gdq-etl:build-cache
        gdq-etl.cache-to=type=registry,ref=ghcr.io/goodow/gdq-etl:build-cache,mode=max
        gdq-infra.cache-from=type=registry,ref=ghcr.io/goodow/gdq-infra:build-cache
        gdq-infra.cache-to=type=registry,ref=ghcr.io/goodow/gdq-infra:build-cache,mode=max
        gdq-rd.cache-from=type=registry,ref=ghcr.io/goodow/gdq-rd:build-cache
        gdq-rd.cache-to=type=registry,ref=ghcr.io/goodow/gdq-rd:build-cache,mode=max
        gdq-sim.cache-from=type=registry,ref=ghcr.io/goodow/gdq-sim:build-cache
        gdq-sim.cache-to=type=registry,ref=ghcr.io/goodow/gdq-sim:build-cache,mode=max

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6GB
          tool-cache: true

      - uses: actions/checkout@v6
      - name: Extract Target Commit
        id: extract
        env:
          # 经环境变量而不是 ${{ }} 内插进脚本: 提交说明是外部输入, 内插会被当成 shell 执行
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TARGET_COMMIT=$(echo "$COMMIT_MSG" | grep -oE '@[0-9a-fA-F]+' | sed 's/@//')
          if [ -z "$TARGET_COMMIT" ]; then
            TARGET_COMMIT="main"
          fi
          echo "TARGET_COMMIT=$TARGET_COMMIT" >> $GITHUB_ENV

      - name: Init and update submodules
        env:
          PAT_FOR_GOODOW_MONO_SUBMODULES: ${{ secrets.PAT_FOR_GOODOW_MONO_SUBMODULES }}
          MONO_REPO: ${{ secrets.MONO_REPO }}
        run: |
          bash .github/scripts/overwrite.sh "${{ env.TARGET_COMMIT }}"
          git config --global url."https://x-access-token:${{ secrets.PAT_FOR_GOODOW_MONO_SUBMODULES }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: USERNAME
          password: ${{ secrets.GHCR_TOKEN_MONO_FOR_TIANXA_GITHUB_ACTIONS }}
#      - name: Login to Docker Hub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKER_USERNAME_HUB }}
#          password: ${{ secrets.DOCKER_PASSWORD_HUB }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata for mono-base
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goodow/mono-base
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_COMMIT }}
          bake-target: mono-base
      - name: Docker metadata for goodow-mono
        id: meta-mono
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goodow/goodow-mono
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_COMMIT }}
          bake-target: goodow-mono
      - name: Docker metadata for gdq-etl
        id: meta-etl
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goodow/gdq-etl
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_COMMIT }}
          bake-target: gdq-etl
      - name: Docker metadata for gdq-infra
        id: meta-infra
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goodow/gdq-infra
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_COMMIT }}
          bake-target: gdq-infra
      - name: Docker metadata for gdq-rd
        id: meta-rd
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goodow/gdq-rd
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_COMMIT }}
          bake-target: gdq-rd
      - name: Docker metadata for gdq-sim
        id: meta-sim
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/goodow/gdq-sim
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_COMMIT }}
          bake-target: gdq-sim

      # Gate: 等待 verify job 完成后再构建推送
      # build prep 步骤已与 verify 并行执行, 仅在此处阻塞
      - name: Wait for verify job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "⏳ Waiting for verify job to complete..."
          while true; do
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '.jobs[] | select(.name == "verify") | .conclusion // empty')
            if [ "$conclusion" = "success" ]; then
              echo "✅ verify passed"
              break
            elif [ -n "$conclusion" ]; then
              echo "❌ verify failed with: $conclusion"
              exit 1
            fi
            sleep 10
          done

      - name: Prepare bake config
        id: bake-config
        run: |
          {
            echo "files<<HEREDOC"
            echo ".devcontainer/docker-compose.yml"
            echo "${{ steps.meta-base.outputs.bake-file }}"
            echo "${{ steps.meta-mono.outputs.bake-file }}"
            echo "${{ steps.meta-etl.outputs.bake-file }}"
            echo "${{ steps.meta-infra.outputs.bake-file }}"
            echo "${{ steps.meta-rd.outputs.bake-file }}"
            echo "${{ steps.meta-sim.outputs.bake-file }}"
            echo "HEREDOC"
          } >> $GITHUB_OUTPUT

      - name: Build and push (Bake)
        id: bake
        uses: docker/bake-action@v6
        with:
          source: .
          files: ${{ steps.bake-config.outputs.files }}
          targets: ${{ env.BAKE_TARGETS }}
          push: true
          # 镜像里的环境变量 SOURCE_COMMIT (各 Dockerfile 末尾的 ARG/ENV): 进容器 `env` 一眼看出是哪个提交建的
          set: |
            ${{ env.BAKE_SET }}
            *.args.SOURCE_COMMIT=${{ env.SOURCE_COMMIT }}

      - name: Send alert
        if: always()
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          JOB_CONTEXT: ${{ toJson(job) }}
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: |
          pip install -U --quiet --disable-pip-version-check goodow-workflow[telegram]
          python -m goodow.workflow.github.send_alert

  # ── :latest 只往前走 ──────────────────────────────────────────────────────
  # 连着合并两个提交时两个 run 并行; 从前各自建完就推 :latest, 先合并的那个后建完, latest 就回到了旧提交。
  # 现在每个 run 建完都在这里重算一次: latest = main 上最新的、全部镜像都已推了 sha-<提交> 的那个提交
  # (.github/scripts/promote_latest.sh)。串行跑 (concurrency), 排队中较早的那次被取消无妨: 后排的读到的只会更多。
  # TCR 同步也在这里: 源是 latest 现在指向的 sha-<提交> (不可变), 不是 :latest 本身。
  promote-latest:
    needs: build-and-push
    if: github.ref_name == 'mono'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-latest-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGES: goodow-mono mono-base gdq-etl gdq-infra gdq-rd gdq-sim
      TCR_IMAGES: goodow-mono gdq-infra

    steps:
      - uses: actions/checkout@v6
        with:
          path: wbt

      # 只要 main 的提交历史 (不要文件内容): 判谁比谁新
      - name: Fetch mono history
        env:
          PAT_FOR_GOODOW_MONO_SUBMODULES: ${{ secrets.PAT_FOR_GOODOW_MONO_SUBMODULES }}
          MONO_REPO: ${{ secrets.MONO_REPO }}
        run: |
          git init -q mono
          git -C mono fetch -q --depth 50 --filter=blob:none \
            "https://x-access-token:${PAT_FOR_GOODOW_MONO_SUBMODULES}@github.com/${MONO_REPO}.git" \
            +refs/heads/main:refs/remotes/origin/main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: USERNAME
          password: ${{ secrets.GHCR_TOKEN_MONO_FOR_TIANXA_GITHUB_ACTIONS }}
      - name: Login to TCR Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME_TCR }}
          password: ${{ secrets.DOCKER_PASSWORD_TCR }}

      - name: Promote latest
        id: promote
        # 锚是 IMAGES 的第一个: 读它 :latest 的 revision 标签
        run: bash wbt/.github/scripts/promote_latest.sh mono ghcr.io/goodow $IMAGES

      - name: Sync Images to TCR via Skopeo
        env:
          REVISION: ${{ steps.promote.outputs.revision }}
        run: |
          if [ -z "$REVISION" ]; then
            echo "::warning::latest 指向的提交读不出 (锚镜像的 :latest 没有可展开的 revision 标签), TCR 不同步"
            exit 0
          fi
          if ! command -v skopeo &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          for i in $TCR_IMAGES; do
            skopeo copy --retry-times 5 \
              "docker://ghcr.io/goodow/$i:sha-$REVISION" \
              "docker://${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_OWNER }}/$i:latest"
          done
          echo "TCR 的 latest = sha-$REVISION ($TCR_IMAGES)"

      - name: Send alert
        if: failure()
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          JOB_CONTEXT: ${{ toJson(job) }}
          RUNNER_CONTEXT: ${{ toJson(runner) }}
        run: |
          pip install -U --quiet --disable-pip-version-check goodow-workflow[telegram]
          python -m goodow.workflow.github.send_alert
