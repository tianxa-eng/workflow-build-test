# 第二个 registry 的登录在某些 runner 上整台不通 (见 src-build.yml 里 "Login to second registry" 的注释):
# 只有这一步失败时, 在新 runner 上重跑失败的任务一次。别的失败 (构建、收尾脚本) 不重跑, 由告警通知人。
name: Source Build retry

on:
  workflow_run:
    workflows: ["Source Build MN", "Source Build MF"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs if only the second registry login failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          only_login=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | length > 0 and all(. == "Login to second registry")')
          if [ "$only_login" = true ]; then
            gh run rerun "$RUN_ID" --failed
          else
            echo "失败不只是第二个 registry 登录, 不重跑"
          fi
